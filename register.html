<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UrbanWear</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-box">

    <h1>Create Account</h1>

    <form id="registerForm">

        <input
            type="text"
            id="first_name"
            placeholder="First Name"
            required
        >

        <input
            type="text"
            id="last_name"
            placeholder="Last Name"
            required
        >

        <select id="gender" required>

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

        </select>

        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="js/auth.js"></script>

</body>
</html>
