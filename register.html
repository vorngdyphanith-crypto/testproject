<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | UrbanWear</title>
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <a class="logo" href="index.html"> Urban<span>Wear</span> </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html">Cart <b id="cartCount">0</b></a>
        <a href="login.html">Login</a>"
        <a class="active" href="register.html">Register</a>
      </nav>
    </header>

    <main
      style="
        min-height: calc(100vh - 180px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      "
    >
      <div
        class="auth-box"
        style="
          width: 100%;
          max-width: 460px;
          background: white;
          padding: 40px;
          border-radius: 12px;
          box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
          margin: 0;
        "
      >
        <div style="text-align: center; margin-bottom: 25px">
          <p class="eyebrow" style="margin-bottom: 5px">JOIN URBANWEAR</p>
          <h1 style="font-size: 28px; font-weight: 700; color: #111">
            Create Account
          </h1>
        </div>

        <form id="registerForm">
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 12px;
              margin-bottom: 15px;
            "
          >
            <div>
              <label
                style="
                  display: block;
                  font-size: 13px;
                  font-weight: 600;
                  margin-bottom: 6px;
                  color: #444;
                "
                >First Name</label
              >
              <input
                type="text"
                id="first_name"
                placeholder="John"
                required
                style="
                  width: 100%;
                  padding: 11px 12px;
                  border: 1px solid #ccc;
                  border-radius: 6px;
                  font-size: 14px;
                "
              />
            </div>
            <div>
              <label
                style="
                  display: block;
                  font-size: 13px;
                  font-weight: 600;
                  margin-bottom: 6px;
                  color: #444;
                "
                >Last Name</label
              >
              <input
                type="text"
                id="last_name"
                placeholder="Doe"
                required
                style="
                  width: 100%;
                  padding: 11px 12px;
                  border: 1px solid #ccc;
                  border-radius: 6px;
                  font-size: 14px;
                "
              />
            </div>
          </div>

          <div style="margin-bottom: 15px">
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
                color: #444;
              "
              >Gender</label
            >
            <select
              id="gender"
              required
              style="
                width: 100%;
                padding: 11px 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
                background: white;
              "
            >
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other / Prefer not to say</option>
            </select>
          </div>

          <div style="margin-bottom: 15px">
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
                color: #444;
              "
              >Email Address</label
            >
            <input
              type="email"
              id="registerEmail"
              placeholder="john.doe@example.com"
              required
              style="
                width: 100%;
                padding: 11px 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
              "
            />
          </div>

          <div style="margin-bottom: 20px">
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
                color: #444;
              "
              >Password</label
            >
            <input
              type="password"
              id="registerPassword"
              placeholder="Create a strong password"
              required
              minlength="6"
              style="
                width: 100%;
                padding: 11px 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
              "
            />
          </div>

          <button
            type="submit"
            class="btn"
            style="
              width: 100%;
              background: #111;
              color: white;
              padding: 13px;
              border: none;
              border-radius: 6px;
              font-size: 15px;
              font-weight: 600;
              cursor: pointer;
              margin: 0;
            "
          >
            Complete Registration
          </button>
        </form>

        <div
          style="
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
          "
        >
          Already have an account?
          <a
            href="login.html"
            style="color: #d4af37; font-weight: 600; text-decoration: none"
            >Sign In</a
          >
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 UrbanWear Inc. All rights reserved.</p>
    </footer>

    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        Store.renderNavbar("register");
      });
    </script>
  </body>
</html>
