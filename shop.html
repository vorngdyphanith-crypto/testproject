<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanWear | Shop</title>
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <a class="logo" href="index.html"> Urban<span>Wear</span> </a>
      <nav>
        <a href="index.html">Home</a>
        <a class="active" href="shop.html">Shop</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html">Cart <b id="cartCount">0</b></a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </header>

    <main class="section shop-page">
      <div class="section-head">
        <div>
          <p class="eyebrow">OUR STORE</p>
          <h1>Shop All</h1>
        </div>
      </div>

      <!-- FILTER & SORT -->
      <!-- CATEGORY NAVBAR & SORT -->
      <div class="filters">
        <button class="filter active" data-cat="All">All</button>
        <button class="filter" data-cat="Men">Men</button>
        <button class="filter" data-cat="Women">Women</button>
        <button class="filter" data-cat="Shoes">Shoes</button>
        <button class="filter" data-cat="Accessories">Accessories</button>
        <div class="filter-pills">
          <button class="filter active" data-cat="All">All</button>
          <button class="filter" data-cat="Men">Men</button>
          <button class="filter" data-cat="Women">Women</button>
          <button class="filter" data-cat="Shoes">Shoes</button>
          <button class="filter" data-cat="Accessories">Accessories</button>
        </div>

        <select id="sort">
          <option value="default">Sort by: Featured</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
        <div class="sort-container">
          <label for="sort" class="sort-label">Sort by:</label>
          <select id="sort">
            <option value="default">Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
          </select>
        </div>
      </div>

      <!-- PRODUCTS GRID -->
      <div id="shopProducts" class="product-grid">
        <!-- Loaded dynamically from Store -->
      </div>
    </main>

    <footer>
      <p>© 2026 UrbanWear Inc. All rights reserved.</p>
    </footer>

    <script src="js/store.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
