<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanWear | Shop</title>
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <a class="logo" href="index.html"> Urban<span>Wear</span> </a>
      <nav>
        <a href="index.html">Home</a>
        <a class="active" href="shop.html">Shop</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html">Cart <b id="cartCount">0</b></a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </header>

    <main class="section shop-page">
      <div class="section-head">
        <div class="head-content">
          <p class="eyebrow"><span class="eyebrow-dot"></span> OUR STORE</p>
          <h1 id="shopHeading">Shop All</h1>
          <p class="section-desc">Explore premium apparel, footwear, and accessories crafted for modern streetwear.</p>
        </div>
      </div>

      <!-- MODERN FILTER & SEARCH TOOLBAR -->
      <div class="shop-toolbar">
        <!-- Top Toolbar Row: Search + Sort -->
        <div class="toolbar-top">
          <div class="search-box">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Search by name, category, or style..." autocomplete="off" />
            <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">✕</button>
          </div>

          <div class="sort-box">
            <span class="sort-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
                <line x1="10" y1="18" x2="14" y2="18"></line>
              </svg>
              Sort by
            </span>
            <div class="select-wrapper">
              <select id="sort">
                <option value="default">Featured</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="name-asc">Name: A to Z</option>
                <option value="name-desc">Name: Z to A</option>
              </select>
              <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
        </div>

        <!-- Category Filter Pills -->
        <div class="category-scroll-container">
          <div class="category-pills" id="categoryPills">
            <button type="button" class="filter active" data-cat="All">
              <span class="pill-name">All Products</span>
              <span class="pill-badge" id="count-all">0</span>
            </button>
            <button type="button" class="filter" data-cat="Men">
              <span class="pill-name">Men's</span>
              <span class="pill-badge" id="count-men">0</span>
            </button>
            <button type="button" class="filter" data-cat="Women">
              <span class="pill-name">Women's</span>
              <span class="pill-badge" id="count-women">0</span>
            </button>
            <button type="button" class="filter" data-cat="Shoes">
              <span class="pill-name">Shoes</span>
              <span class="pill-badge" id="count-shoes">0</span>
            </button>
            <button type="button" class="filter" data-cat="Accessories">
              <span class="pill-name">Accessories</span>
              <span class="pill-badge" id="count-accessories">0</span>
            </button>
          </div>
        </div>

        <!-- Meta status & Active filter clear tag -->
        <div class="toolbar-meta">
          <div class="products-count" id="productsCount">
            Showing <strong>0</strong> items
          </div>
          <div class="active-chips" id="activeChips" style="display: none;">
            <span class="chip-item" id="activeChip">
              <span id="activeChipText">All</span>
              <button type="button" id="clearFilterChip" title="Remove filter">✕</button>
            </span>
          </div>
        </div>
      </div>

      <!-- PRODUCTS GRID -->
      <div id="shopProducts" class="product-grid">
        <!-- Loaded dynamically from Store -->
      </div>
    </main>

    <footer>
      <p>© 2026 UrbanWear Inc. All rights reserved.</p>
    </footer>

    <script src="js/store.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
